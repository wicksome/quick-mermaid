<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: #1d1d1f; background: #ffffff;
    overflow: hidden;
  }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 44px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    background: rgba(245,245,247,0.92);
    border-bottom: 1px solid #e3e3e6;
    backdrop-filter: saturate(180%) blur(20px);
    z-index: 10;
  }
  #toolbar button {
    height: 26px; width: 30px; padding: 0;
    border: 1px solid #d2d2d7; border-radius: 6px;
    background: #fff; color: #1d1d1f; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #toolbar button svg { width: 15px; height: 15px; display: block; }
  #toolbar button:hover { background: #f0f0f3; }
  #toolbar button.on { background: #007aff; color: #fff; border-color: #007aff; }
  #toolbar button.done { background: #30d158; color: #fff; border-color: #30d158; }
  #toolbar button:disabled { opacity: 0.32; cursor: default; }
  #toolbar button:disabled:hover { background: #fff; }
  #zoomLabel { font-size: 12px; color: #6e6e73; min-width: 42px; text-align: center; }
  /* engine + render-time readout next to the reset button */
  #meta { display: none; align-items: center; gap: 6px; margin-left: 6px; font-size: 11px; color: #8a8a8e; white-space: nowrap; }
  #meta.show { display: inline-flex; }
  #meta .eng { font-weight: 600; border-radius: 4px; padding: 1px 6px; }
  #meta .eng.mmd { color: #1a6fd0; background: #e8f1ff; }
  #meta .eng.puml { color: #1f8a4c; background: #e7f7ee; }
  #meta .ms { font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }

  body.preview #toolbar { display: none; }
  body.preview #stage { top: 0; }

  #stage {
    position: absolute; top: 44px; left: 0; right: 0; bottom: 0;
    overflow: hidden; cursor: grab;
  }
  #stage.panning { cursor: grabbing; }
  #content {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0; padding: 24px;
  }
  #diagram svg { display: block; }

  /* empty/error state view */
  #state {
    display: none; position: absolute; inset: 44px 0 0 0;
    align-items: center; justify-content: center; flex-direction: column;
    text-align: center; padding: 32px;
  }
  body.preview #state { inset: 0; }
  #state .glyph { font-size: 56px; line-height: 1; margin-bottom: 16px; opacity: .9; }
  #state .title { font-size: 17px; font-weight: 600; color: #1d1d1f; }
  #state .subtitle { font-size: 13px; color: #6e6e73; margin-top: 8px; max-width: 420px; }
  #state .detail {
    display: none; margin-top: 16px; max-width: 560px; width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    color: #8a1c1c; background: #fff3f3; border: 1px solid #f0caca;
    border-radius: 8px; padding: 10px 12px; text-align: left;
    white-space: pre-wrap; word-break: break-word;
  }

  /* source overlay */
  #source {
    display: none; position: absolute; inset: 44px 0 0 0;
    background: #fbfbfd; overflow: auto; padding: 20px;
  }
  body.preview #source { inset: 0; }
  #source pre {
    margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; line-height: 1.6; color: #1d1d1f; white-space: pre-wrap; word-break: break-word;
  }
  #source .kw { color: #9b2393; font-weight: 600; }   /* keyword */
  #source .op { color: #0b7285; }                       /* arrow/operator */
  #source .c  { color: #6e7781; font-style: italic; }   /* comment */

  /* history overlay */
  #history {
    display: none; position: absolute; inset: 44px 0 0 0;
    background: #fbfbfd; overflow: auto;
  }
  body.preview #history { inset: 0; }
  #history .empty { color: #8a8a8e; font-size: 13px; padding: 24px; text-align: center; }
  #history .ghdr {
    position: sticky; top: 0; z-index: 1;
    padding: 8px 16px 4px; font-size: 11px; font-weight: 600;
    color: #8a8a8e; text-transform: uppercase; letter-spacing: 0.04em;
    background: #fbfbfd;
  }
  #history .item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px 9px 16px; border-bottom: 1px solid #ececef; cursor: pointer;
  }
  #history .item:hover { background: #eef1f5; }
  #history .item .thumb {
    flex: none; width: 56px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 1px solid #e3e3e6; border-radius: 6px; overflow: hidden;
  }
  #history .item .thumb svg { display: block; width: 100%; height: 100%; }
  #history .item .thumb.ph { color: #c7c7cc; font-size: 15px; }   /* placeholder while rendering / on failure */
  #history .item .meta { flex: 1; min-width: 0; }
  #history .item .t {
    font-size: 13px; font-weight: 600; color: #1d1d1f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #history .item .src {
    margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: #8a8a8e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #history .item .eng {
    display: inline-block; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 10px; font-weight: 600; border-radius: 4px; padding: 0 5px; margin-right: 6px;
  }
  #history .item .eng.mmd { color: #1a6fd0; background: #e8f1ff; }
  #history .item .eng.puml { color: #1f8a4c; background: #e7f7ee; }
  #history .item .del, #history .item .hcopy {
    flex: none; width: 28px; height: 28px; padding: 0;
    border: none; background: none; color: #b0b0b5; cursor: pointer;
    display: none; align-items: center; justify-content: center; border-radius: 6px;
  }
  #history .item .del svg, #history .item .hcopy svg { width: 15px; height: 15px; }
  #history .item:hover .del, #history .item:hover .hcopy { display: inline-flex; }
  #history .item .del:hover { background: #e3e3e6; color: #d11; }
  #history .item .hcopy:hover { background: #e3e3e6; color: #007aff; }
  #history .item .hcopy.done { color: #30d158; }

  /* toast (copy/save feedback) */
  #toast {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    display: flex; align-items: center; gap: 9px;
    padding: 13px 20px; border-radius: 14px;
    background: rgba(28,28,30,0.9); color: #fff;
    font-size: 15px; font-weight: 600; letter-spacing: -0.2px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.28);
    backdrop-filter: blur(20px) saturate(180%);
    opacity: 0; pointer-events: none; z-index: 100;
    transition: opacity .18s ease, transform .2s cubic-bezier(.2,.8,.2,1);
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #toast .ic {
    width: 20px; height: 20px; border-radius: 50%;
    background: #30d158; color: #fff; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  #toolbar button.done { background: #30d158; color: #fff; border-color: #30d158; }
</style>
<script src="mermaid.min.js"></script>
</head>
<body>
  <div id="toolbar">
    <button id="zoomFit" title="Fit to window (Space)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <button id="zoomOut" title="Zoom out (⌘−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" title="Zoom in (⌘+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button id="zoomReset" title="Reset (⌘0)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
    <span id="meta"><span class="eng"></span><span class="ms"></span></span>
    <span class="spacer"></span>
    <button id="histBtn" title="Recent diagrams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg></button>
    <button id="srcBtn" title="Show source text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
    <button id="saveBtn" title="Save as PNG (⌘S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
    <button id="copyBtn" title="Copy image (⌘C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
  </div>

  <div id="stage">
    <div id="content"><div id="diagram"></div></div>
  </div>

  <div id="state">
    <div class="glyph"></div>
    <div class="title"></div>
    <div class="subtitle"></div>
    <div class="detail"></div>
  </div>

  <div id="source"><pre><code id="srcCode"></code></pre></div>

  <div id="history"></div>

  <div id="toast"><span class="ic">✓</span><span class="tx"></span></div>

  <script>
    var lastCode = "";
    var currentTheme = "default";
    var currentBg = "#ffffff";
    var scale = 1, panX = 0, panY = 0;
    var baseZoom = 1;   // multiplier applied on top of fit-to-window (from default zoom setting)
    var sourceOpen = false;
    var historyOpen = false;
    var rendered = false;    // true only when a diagram is currently shown (not empty/error state)
    var renderSeq = 0;       // unique mermaid render id counter (avoids id collisions on rapid renders)
    var historyItems = [];   // recent diagram sources (most recent first), injected by Swift
    var suppressKeyCopyUntil = 0;   // ignore keyboard ⌘C until this time (blocks the selection-grab ⌘C echo right after open)
    var activeEngine = 'mermaid';   // engine that drew the current diagram (drives source-view highlighting)
    var exportOverride = null;      // when set, exportData() returns this payload once (used by history-row image copy)
    var currentFont = "default";   // diagram-text font family; "default" = each engine's built-in

    if (location.hash.indexOf('preview') !== -1) document.body.classList.add('preview');

    // ── i18n (use "ko" when system language is Korean, otherwise "en") ──
    var I18N = {
      ko: {
        reset: '초기화', source: '</> 소스', save: '이미지 저장', copy: '이미지 복사',
        emptyTitle: '표시할 다이어그램이 없어요', emptySub: '먼저 Mermaid 또는 PlantUML 텍스트를 선택(또는 복사)한 뒤 다시 시도하세요.',
        errTitle: '다이어그램을 그릴 수 없어요', errSub: '문법 오류로 보입니다. 상단 “소스” 버튼으로 원문을 확인하세요.',
        loadFail: 'mermaid.js 로드 실패', loadFailSub: 'mermaid.min.js 를 찾지 못했습니다.',
        pumlLoadFail: 'PlantUML 엔진 로드 실패', pumlLoadFailSub: 'plantuml.js / viz-global.js 를 찾지 못했습니다.',
        pumlLoading: 'PlantUML 엔진 준비 중…', pumlLoadingSub: '처음 한 번 엔진을 불러오는 중입니다.',
        copied: '복사됨', saved: '저장됨', copyDone: '✓ 복사됨',
        tipZoomOut: '축소 (⌘−)', tipZoomIn: '확대 (⌘+)', tipReset: '맞춤 (⌘0)', tipFit: '창에 맞춤 (Space)',
        tipHistory: '최근 다이어그램', tipSource: '소스 보기',
        tipSave: '이미지 저장 (⌘S)', tipCopy: '이미지 복사 (⌘C)', tipCopyCode: '코드 복사 (⌘C)',
        histEmpty: '최근 다이어그램이 없어요',
        today: '오늘', yesterday: '어제', delete: '삭제'
      },
      en: {
        reset: 'Reset', source: '</> Source', save: 'Save PNG', copy: 'Copy PNG',
        emptyTitle: 'Nothing to render', emptySub: 'Select (or copy) some Mermaid or PlantUML text and try again.',
        errTitle: 'Could not render the diagram', errSub: 'Looks like a syntax error. Use the “Source” button above to inspect.',
        loadFail: 'Failed to load mermaid.js', loadFailSub: 'mermaid.min.js was not found.',
        pumlLoadFail: 'Failed to load the PlantUML engine', pumlLoadFailSub: 'plantuml.js / viz-global.js was not found.',
        pumlLoading: 'Preparing the PlantUML engine…', pumlLoadingSub: 'Loading the engine for the first time.',
        copied: 'Copied', saved: 'Saved', copyDone: '✓ Copied',
        tipZoomOut: 'Zoom out (⌘−)', tipZoomIn: 'Zoom in (⌘+)', tipReset: 'Fit (⌘0)', tipFit: 'Fit to window (Space)',
        tipHistory: 'Recent diagrams', tipSource: 'Show source',
        tipSave: 'Save image (⌘S)', tipCopy: 'Copy image (⌘C)', tipCopyCode: 'Copy code (⌘C)',
        histEmpty: 'No recent diagrams',
        today: 'Today', yesterday: 'Yesterday', delete: 'Delete'
      }
    };
    function pickLang(lang) {
      var l = lang || navigator.language || 'en';
      return l.slice(0, 2) === 'ko' ? 'ko' : 'en';
    }
    var L = I18N[pickLang(null)];
    function applyI18n(lang) {
      L = I18N[pickLang(lang)];
      var $ = function (id) { return document.getElementById(id); };
      // icon buttons: localize tooltips only
      $('zoomOut').title = L.tipZoomOut;
      $('zoomIn').title = L.tipZoomIn;
      $('zoomReset').title = L.tipReset;
      $('zoomFit').title = L.tipFit;
      $('histBtn').title = L.tipHistory;
      $('srcBtn').title = L.tipSource;
      $('saveBtn').title = L.tipSave;
      $('copyBtn').title = sourceOpen ? L.tipCopyCode : L.tipCopy;
      if (historyOpen) renderHistory();
    }

    function post(ok, info) {
      try { window.webkit.messageHandlers.result.postMessage({ ok: ok, info: String(info), code: lastCode, engine: activeEngine }); } catch (e) {}
    }

    function applyTransform() {
      document.getElementById('content').style.transform =
        'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
      document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
    }
    function setScale(next, cx, cy) {
      next = Math.min(8, Math.max(0.1, next));
      var stage = document.getElementById('stage');
      if (cx == null) { cx = stage.clientWidth / 2; cy = stage.clientHeight / 2; }
      panX = cx - (cx - panX) * (next / scale);
      panY = cy - (cy - panY) * (next / scale);
      scale = next; applyTransform();
    }
    function centerContent() {
      var stage = document.getElementById('stage');
      var content = document.getElementById('content');
      var sw = stage.clientWidth, sh = stage.clientHeight;
      var cw = content.offsetWidth, ch = content.offsetHeight;
      panX = (sw - cw * scale) / 2;
      panY = (ch * scale <= sh) ? (sh - ch * scale) / 2 : 16;
      applyTransform();
    }
    // Scale so the diagram fits the stage (so it opens at a readable size, not tiny).
    // Upscaling is capped to avoid blowing up trivially small diagrams.
    function fitScale() {
      var stage = document.getElementById('stage');
      var content = document.getElementById('content');
      var sw = stage.clientWidth, sh = stage.clientHeight;
      var cw = content.offsetWidth, ch = content.offsetHeight;
      if (cw < 1 || ch < 1) return 1;
      var s = Math.min(sw / cw, sh / ch);
      return Math.max(0.1, Math.min(s, 2.5));
    }
    function resetView() { scale = fitScale() * baseZoom; centerContent(); }
    // Fit the diagram to the *current* window size (fills it, up to the max zoom) — for
    // when the user resized the window and wants the diagram to match. Unlike resetView,
    // not capped to the conservative open-size scale.
    function fitView() {
      var stage = document.getElementById('stage'), content = document.getElementById('content');
      var sw = stage.clientWidth, sh = stage.clientHeight, cw = content.offsetWidth, ch = content.offsetHeight;
      if (cw < 1 || ch < 1) return;
      scale = Math.max(0.1, Math.min(8, Math.min(sw / cw, sh / ch)));
      centerContent();
    }

    // empty/error state view (we render this instead of mermaid's default error screen)
    function showState(glyph, title, subtitle, detail) {
      rendered = false;                          // no diagram → export disabled
      setMeta(null);                             // hide the engine/time readout
      document.getElementById('diagram').innerHTML = '';
      document.getElementById('stage').style.display = 'none';
      var s = document.getElementById('state');
      s.style.display = 'flex';
      s.querySelector('.glyph').textContent = glyph;
      s.querySelector('.title').textContent = title;
      s.querySelector('.subtitle').textContent = subtitle || '';
      var d = s.querySelector('.detail');
      if (detail) { d.style.display = 'block'; d.textContent = detail; }
      else { d.style.display = 'none'; }
      if (typeof updateExportButtons === 'function') updateExportButtons();
    }
    function hideState() {
      document.getElementById('state').style.display = 'none';
      document.getElementById('stage').style.display = '';
    }

    function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

    // toolbar readout: which engine drew the current diagram + how long it took.
    // Remembered so it can be hidden behind an overlay and restored on return; it
    // describes the diagram, so it's only shown in the diagram view.
    var metaEngine = null, metaMs = 0;
    function setMeta(engine, ms) { metaEngine = engine; metaMs = ms || 0; refreshMeta(); }
    function refreshMeta() {
      var el = document.getElementById('meta');
      if (!metaEngine || sourceOpen || historyOpen) { el.classList.remove('show'); return; }
      var eng = el.querySelector('.eng');
      eng.textContent = metaEngine === 'plantuml' ? 'PlantUML' : 'Mermaid';
      eng.className = 'eng ' + (metaEngine === 'plantuml' ? 'puml' : 'mmd');
      el.querySelector('.ms').textContent = metaMs >= 1000 ? (metaMs / 1000).toFixed(1) + ' s' : Math.round(metaMs) + ' ms';
      el.classList.add('show');
    }

    // clean up temporary/error nodes mermaid left in body (keep only #toolbar/#stage/#state/#source)
    function cleanupOrphans() {
      var keep = { 'toolbar': 1, 'stage': 1, 'state': 1, 'source': 1, 'history': 1, 'toast': 1 };
      Array.prototype.slice.call(document.body.children).forEach(function (el) {
        if (el.tagName === 'SCRIPT') return;
        if (!keep[el.id]) el.parentNode.removeChild(el);
      });
    }

    // ── Engine detection ──
    // PlantUML source opens with an `@start…` directive; detect it so bare (un-fenced)
    // input routes correctly. Everything without it is treated as Mermaid.
    function isPlantUML(code) { return /^\s*@start\w+/i.test(code || ''); }

    // Strip a leading Markdown code fence (```lang … ```) and report its language tag.
    // The tag drives engine routing (```puml/```plantuml → PlantUML, ```mermaid →
    // Mermaid) and overrides content detection. This fence handling lives here (not in
    // Swift) so the language tag survives long enough to route.
    function stripFence(code) {
      var t = (code || '').trim();
      if (t.slice(0, 3) !== '```') return { body: t, lang: '' };
      var nl = t.indexOf('\n');
      var lang = (nl > 0 ? t.slice(3, nl) : t.slice(3)).trim().toLowerCase();
      var body = nl > 0 ? t.slice(nl + 1) : '';
      body = body.replace(/\s*```\s*$/, '');   // drop the closing fence if present
      return { body: body.trim(), lang: lang };
    }
    function detectEngine(lang, body) {
      if (lang === 'puml' || lang === 'plantuml' || lang === 'iuml') return 'plantuml';
      if (lang === 'mermaid' || lang === 'mmd') return 'mermaid';
      return isPlantUML(body) ? 'plantuml' : 'mermaid';
    }

    // Diagram-level directives injected just after the @start… line of PlantUML source.
    // A generalized seam: font is the first consumer; a future footer setting adds a line here.
    function pumlPreamble(font) {
      var lines = [];
      if (font && font !== 'default') lines.push('skinparam defaultFontName "' + font + '"');
      return lines;
    }
    // Insert `lines` right after the first @start… line. No @start → return code unchanged.
    function injectAfterStart(code, lines) {
      if (!lines || !lines.length) return code;
      var src = code.split(/\r\n|\r|\n/);
      for (var i = 0; i < src.length; i++) {
        if (/^\s*@start\w+/i.test(src[i])) {
          src.splice.apply(src, [i + 1, 0].concat(lines));
          return src.join('\n');
        }
      }
      return code;
    }

    var pendingEngine = null;   // engine resolved by window.render (fence-aware); consumed once by doRender

    // The PlantUML engine (plantuml.js ~7.6MB + viz-global.js ~1.4MB) is loaded on
    // first use only, so Mermaid-only sessions never pay its parse cost. viz-global.js
    // must load before plantuml.js (the engine reads the global `Viz`).
    var pumlLoading = null;
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = function () { reject(new Error('failed to load ' + src)); };
        document.head.appendChild(s);
      });
    }
    function ensurePlantUML() {
      if (window.__puml && window.__puml.render) return Promise.resolve();
      if (!pumlLoading) {
        pumlLoading = loadScript('viz-global.js')
          .then(function () { return loadScript('plantuml.js'); })
          .catch(function (e) { pumlLoading = null; throw e; });
      }
      return pumlLoading;
    }

    // plantuml.js renders asynchronously into a target element (by id) and returns
    // nothing — it has no completion callback. We watch the target with a
    // MutationObserver and settle once mutations go quiet (or a hard timeout fires).
    function renderPlantUMLInto(targetEl, code, dark) {
      return new Promise(function (resolve, reject) {
        targetEl.innerHTML = '';
        var settled = false, quietTimer = null;
        var obs = new MutationObserver(function () {
          clearTimeout(quietTimer);

        });

        var hardTimer = setTimeout(function () { finish(true); }, 15000);
        function finish(timedOut) {

          if (svg) resolve(svg);
          else reject(new Error(timedOut ? 'PlantUML render timed out' : 'no diagram produced'));

        } catch (e) { obs.disconnect(); clearTimeout(hardTimer); reject(e); }

    }

    // Render a PlantUML diagram offscreen and return its SVG string (or '' on failure).

    // — which only prunes direct <body> children — won't remove it mid-render.
    async function renderPlantUMLToString(code) {

      tmp.id = 'puthumb_' + (++thumbSeq);

      document.getElementById('stage').appendChild(tmp);

        var svg = await renderPlantUMLInto(tmp, injectAfterStart(code, pumlPreamble(currentFont)), false);
        return svg ? svg.outerHTML : '';
      } catch (e) {

      } finally {
        if (tmp.parentNode) tmp.parentNode.removeChild(tmp);
      }
    }

    async function doRenderPlantUML() {
      // First render pays the engine load; show a brief loading state so the panel
      // isn't blank while ~9MB of JS parses.
      if (!(window.__puml && window.__puml.render)) showState('⏳', L.pumlLoading, L.pumlLoadingSub);
      try {
        await ensurePlantUML();
      } catch (e) {
        showState('⚠️', L.pumlLoadFail, L.pumlLoadFailSub);
        post(false, 'plantuml engine not loaded: ' + ((e && e.message) || e));
        return;
      }
      try {
        // Note: on a syntax error PlantUML draws its own error graphic into the SVG
        // (the engine is a black box — we can't suppress it like Mermaid's), so a
        // malformed diagram still resolves here rather than hitting the catch.
        var t0 = now();
        var pumlCode = injectAfterStart(lastCode, pumlPreamble(currentFont));
        var svg = await renderPlantUMLInto(document.getElementById('diagram'), pumlCode, currentTheme === 'dark');
        var dt = now() - t0;

      } catch (e) {
        cleanupOrphans();
        var msg = (e && e.message) ? e.message : String(e);
        showState('🚫', L.errTitle, L.errSub, msg);
        post(false, msg);
      }
    }

    async function doRender() {
      cleanupOrphans();

      // tests) fall back to content detection.
      var engine = pendingEngine; pendingEngine = null;
      if (!engine) engine = isPlantUML(lastCode) ? 'plantuml' : 'mermaid';
      activeEngine = engine;
      // Gate exports + the readout while this render is in flight: the previous diagram
      // is no longer what's about to be shown, so copy/save/meta must not point at it.
      rendered = false; setMeta(null); updateExportButtons();

      } catch (e) {
        cleanupOrphans();
        var msg = (e && e.message) ? e.message : String(e);
        showState('🚫', L.errTitle, L.errSub, msg);

      }
    }

    function applyBackground(bg) {
      var color = bg || '#ffffff';
      currentBg = color;
      document.documentElement.style.background = color;
      document.body.style.background = color;
    }

    // extract only the diagram SVG at its natural size (Swift renders it offscreen and converts to PNG)
    // Build the export payload ({svg,w,h,bg}) from an svg element at its natural size.
    function svgPayload(svg) {

      }
      if (!w || !h) { var r = svg.getBoundingClientRect(); w = r.width / scale; h = r.height / scale; }

    // returned once instead of the on-screen diagram — used to copy a history row's image.
    window.exportData = function () {

      return svgPayload(document.querySelector('#diagram svg'));
    };

    // ── source highlighting (lightweight, approximates mermaid syntax) ──
    function escapeHtml(s) {

      h = h.replace(/\b(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram-v2|stateDiagram|erDiagram|gantt|pie|journey|mindmap|gitGraph|timeline|quadrantChart|TD|TB|LR|RL|BT|participant|actor|loop|alt|opt|par|rect|critical|break|else|and|end|note|over|activate|deactivate|class|subgraph|direction|click|style|linkStyle|section)\b/g, '<span class="kw">$1</span>');
      return h;
    }
    // PlantUML highlighter. Single pass (alternation + replacer) so inserted spans are
    // never re-scanned — avoids the "class" keyword matching inside a `class="…"` attribute.
    function highlightPlantUML(src) {
      var esc = escapeHtml(src);
      var RE = /(\/'[\s\S]*?'\/)|(^[ \t]*'[^\n]*)|(@\w+)|(&lt;\|--|--\|&gt;|&lt;\|\.\.|\.\.\|&gt;|--&gt;&gt;|-&gt;&gt;|--&gt;|-&gt;|\.\.&gt;|&lt;--|&lt;\.\.|\*--|--\*|o--|--o|\.\.|--)|(\b(?:participant|actor|boundary|control|entity|database|collections|queue|class|interface|abstract|enum|annotation|object|package|namespace|component|node|folder|frame|cloud|artifact|rectangle|usecase|state|map|json|note|alt|else|opt|loop|par|break|critical|group|ref|activate|deactivate|destroy|create|return|title|header|footer|legend|caption|newpage|skinparam|hide|show|remove|start|stop|detach|if|then|elseif|endif|repeat|while|endwhile|switch|case|endswitch|fork|partition|split|as|over|autonumber|end)\b)/gm;

      if (dateKey(ts) === dateKey(y.getTime() / 1000)) return L.yesterday;

        return;

      for (var i = 0; i < historyItems.length; i++) {
        var it = historyItems[i], code = itemCode(it), ts = (it && it.ts) || 0;
        var k = dateKey(ts);

        var engName = eng === 'plantuml' ? 'PlantUML' : 'Mermaid';
        html += '<div class="item" data-i="' + i + '">'

              + '<div class="meta"><div class="t">' + escapeHtml(firstLine(code)) + '</div>'
              + '<div class="src"><span class="eng ' + engCls + '">' + engName + '</span>' + escapeHtml(oneLine) + '</div></div>'
              + '<button class="hcopy" data-i="' + i + '" title="' + escapeHtml(L.copy) + '">'
              + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
              + '</button>'
              + '<button class="del" data-i="' + i + '" title="' + escapeHtml(L.delete) + '">'
              + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
              + '</button></div>';
      }

      Array.prototype.forEach.call(el.querySelectorAll('.item'), function (node) {
        node.onclick = function () { loadFromHistory(parseInt(node.getAttribute('data-i'), 10)); };
      });
      Array.prototype.forEach.call(el.querySelectorAll('.hcopy'), function (btn) {
        btn.onclick = function (ev) { ev.stopPropagation(); copyHistoryImage(parseInt(btn.getAttribute('data-i'), 10)); };
      });
      Array.prototype.forEach.call(el.querySelectorAll('.del'), function (btn) {

      });

    }

    // Render a small diagram preview for each history row. Async + cached by code
    // so reopening history is instant; a parse failure falls back to a glyph and
    // never breaks the row. `gen` guards against an older run filling stale rows
    // after the list re-rendered.
    var thumbCache = {};   // code -> svg string ('' = render failed)
    var thumbGen = 0, thumbSeq = 0, thumbsDone = Promise.resolve();
    function setThumbPlaceholder(box, glyph) { box.classList.add('ph'); box.textContent = glyph; }
    function fillThumb(box, svg) {
      box.classList.remove('ph');
      box.innerHTML = svg;
      var s = box.querySelector('svg');
      if (s) {
        // Scale the whole diagram to fit the small box (letterboxed via viewBox),
        // overriding the width/height/max-width mermaid emits — otherwise the
        // natural-size svg overflows and the box just shows clipped whitespace.
        s.setAttribute('width', '100%');
        s.setAttribute('height', '100%');

        s.style.maxHeight = 'none';
      }
    }
    async function renderThumbnails(gen) {
      if (!window.mermaid) return;
      var boxes = document.getElementById('history').querySelectorAll('.thumb');
      for (var i = 0; i < boxes.length; i++) {
        if (gen !== thumbGen) return;   // a newer renderHistory() superseded us
        var box = boxes[i];
        var hit = historyItems[parseInt(box.getAttribute('data-i'), 10)];
        var code = itemCode(hit);
        if (!code || !code.trim()) { setThumbPlaceholder(box, '⌗'); continue; }
        // PlantUML history items render offscreen via the engine (cached by code like
        // the Mermaid path); a failure falls back to a neutral marker.
        if (itemEngine(hit) === 'plantuml') {
          if (thumbCache[code] !== undefined) {
            if (thumbCache[code]) fillThumb(box, thumbCache[code]); else setThumbPlaceholder(box, '🌿');
            continue;
          }
          // Don't pull in the ~9MB engine just to draw a thumbnail — only render once it's
          // already loaded (i.e. the user has opened a PlantUML diagram this session).
          // Leave the cache unset so the row fills in next time history opens.
          if (!(window.__puml && window.__puml.render)) { setThumbPlaceholder(box, '🌿'); continue; }
          var psvg = await renderPlantUMLToString(code);

          if (gen === thumbGen) { if (psvg) fillThumb(box, psvg); else setThumbPlaceholder(box, '🌿'); }

          var out = await mermaid.render('thumb' + (++thumbSeq) + '_' + Date.now(), code);
          thumbCache[code] = out.svg;

    }
    function deleteHistory(i) {

    }

    }
    function toggleHistory() {
      historyOpen = !historyOpen;
      if (historyOpen) { sourceOpen = false; document.getElementById('source').style.display = 'none'; document.getElementById('srcBtn').classList.remove('on'); }
      document.getElementById('history').style.display = historyOpen ? 'block' : 'none';
      document.getElementById('histBtn').classList.toggle('on', historyOpen);

      updateExportButtons();
    }
    function loadFromHistory(i) {

      closeHistory();
      if (sourceOpen) renderSource();
      doRender();
    }
    // Copy a history row's diagram as PNG without leaving the list: render its SVG

    async function copyHistoryImage(i) {

    applyI18n();

    // ── In-app test harness (run via `QuickMermaid --test`) ──
    window.__test = async function () {
      var R = [];

      var stage = 'start';
      try {
      // render a valid diagram
      lastCode = 'graph TD\n  A-->B'; currentTheme = 'default';
      await doRender();
      ok('render.valid.svg', $('diagram').querySelectorAll('svg').length === 1);
      ok('render.valid.noState', $('state').style.display !== 'flex');
      ok('render.valid.fitScale', scale > 0);
      ok('meta.mermaid', $('meta').classList.contains('show')
        && $('meta').querySelector('.eng').textContent === 'Mermaid'
        && /\d/.test($('meta').querySelector('.ms').textContent));

      // engine detection: @start… routes to PlantUML, everything else to Mermaid
      ok('puml.detect', isPlantUML('@startuml\nA->B\n@enduml') === true
        && isPlantUML('  @startmindmap\n*a') === true
        && isPlantUML('graph TD\n A-->B') === false);

      // PlantUML: lazy-load the engine and render a class diagram (exercises the
      // Graphviz/WASM layout path), reusing the shared fit/export pipeline.
      lastCode = '@startuml\nclass A {\n +foo()\n}\nclass B\nA --> B : uses\n@enduml';
      await doRender();
      ok('puml.render.svg', $('diagram').querySelectorAll('svg').length === 1);
      ok('puml.render.noState', $('state').style.display !== 'flex');
      ok('puml.meta', $('meta').querySelector('.eng').textContent === 'PlantUML');
      ok('puml.export.enabled', $('copyBtn').disabled === false);
      var pumlPd = window.exportData();
      ok('puml.exportData', !!pumlPd && JSON.parse(pumlPd).svg.indexOf('<svg') !== -1);
      // PlantUML source view is highlighted by the engine-aware highlighter (keywords + arrows)
      toggleSource();
      ok('puml.source.highlighted', /class="kw"/.test($('srcCode').innerHTML) && /class="op"/.test($('srcCode').innerHTML));
      toggleSource();

      // fence-aware routing: a ```lang code fence is stripped and its tag picks the
      // engine (overriding content), while plain Mermaid fences keep stripping.
      var fp1 = stripFence('```mermaid\ngraph TD\n A-->B\n```');
      ok('fence.mermaid.strip', fp1.lang === 'mermaid' && fp1.body === 'graph TD\n A-->B'
        && detectEngine(fp1.lang, fp1.body) === 'mermaid');
      var fp2 = stripFence('```puml\n@startuml\nA->B\n@enduml\n```');
      ok('fence.puml.strip', fp2.lang === 'puml' && detectEngine(fp2.lang, fp2.body) === 'plantuml');
      // a puml fence wins even when the body has no @start; mermaid fence wins over @start-looking body
      ok('fence.lang.overrides', detectEngine('plantuml', 'class A') === 'plantuml'
        && detectEngine('mermaid', '@startuml') === 'mermaid');
      ok('fence.none.content', detectEngine('', '@startuml\nA->B') === 'plantuml'
        && detectEngine('', 'graph TD') === 'mermaid');
      // integration: window.render strips the fence and routes/records the body
      window.render('```mermaid\ngraph TD\n  P-->Q\n```', 'default', 100, '#fff', 'en');
      await new Promise(function (r) { setTimeout(r, 300); });
      ok('fence.render.mermaid', $('diagram').querySelectorAll('svg').length === 1 && lastCode === 'graph TD\n  P-->Q');
      window.render('```puml\n@startuml\nclass A\nclass B\nA --> B\n@enduml\n```', 'default', 100, '#fff', 'en');
      await new Promise(function (r) { setTimeout(r, 1500); });
      ok('fence.render.puml', $('diagram').querySelectorAll('svg').length === 1 && lastCode.indexOf('@startuml') === 0);

      // PlantUML history items: engine label + offscreen-rendered thumbnail (engine is
      // loaded by now). thumbCache is cleared first so this row actually renders.
      thumbCache = {};
      setHistory([{ code: '@startuml\nclass A\nclass B\nA --> B\n@enduml', ts: Date.now() / 1000 }]);
      toggleHistory();
      ok('puml.history.engineLabel', !!$('history').querySelector('.eng.puml')
        && $('history').querySelector('.eng').textContent === 'PlantUML');
      await thumbsDone;
      ok('puml.history.thumb', $('history').querySelectorAll('.thumb svg').length === 1);
      toggleHistory();   // close so later history tests start clean

      // invalid → error state + export disabled
      lastCode = '%%nope%%\n@@@@'; await doRender();
      ok('render.invalid.state', $('state').style.display === 'flex');
      ok('export.disabled.failure', $('copyBtn').disabled === true && $('saveBtn').disabled === true);

      // empty → empty state
      lastCode = '   '; await doRender();
      ok('render.empty.state', $('state').style.display === 'flex');

      // a fresh valid render re-enables export
      lastCode = 'graph TD\n  A-->B'; await doRender();
      ok('export.enabled.afterRender', $('copyBtn').disabled === false);

      // source overlay toggles + shows highlighted code
      lastCode = 'graph TD\n  A-->B'; await doRender();
      toggleSource();
      ok('source.opens', $('source').style.display === 'block' && $('srcCode').innerHTML.length > 0);
      toggleSource();
      ok('source.closes', $('source').style.display === 'none');

      // source view: copy stays enabled (copies the source TEXT), save + zoom are disabled
      toggleSource();
      ok('source.copy.enabled', $('copyBtn').disabled === false);
      ok('source.save.disabled', $('saveBtn').disabled === true);
      ok('source.zoom.disabled', $('zoomIn').disabled === true && $('zoomOut').disabled === true && $('zoomReset').disabled === true);
      ok('source.copy.tooltip', $('copyBtn').title === L.tipCopyCode);   // hover says "copy code", not image
      var srcCopyKind = null; __onCopy = function (k) { srcCopyKind = k; };
      doCopy();
      ok('source.copy.isText', srcCopyKind === 'text');
      __onCopy = null;
      toggleSource();
      // back to the diagram: copy/save/zoom all re-enabled, tooltip back to "copy image"
      ok('export.enabled.afterSource', $('copyBtn').disabled === false && $('saveBtn').disabled === false && $('zoomIn').disabled === false);
      ok('diagram.copy.tooltip', $('copyBtn').title === L.tipCopy);

      // "/" toggles the source view (diagram view only); pressing it again returns to the diagram
      lastCode = 'graph TD\n  A-->B'; await doRender();
      ok('slash.startsDiagram', sourceOpen === false);
      window.dispatchEvent(new KeyboardEvent('keydown', { key: '/' }));
      ok('slash.opensSource', sourceOpen === true && $('source').style.display === 'block');
      window.dispatchEvent(new KeyboardEvent('keydown', { key: '/' }));
      ok('slash.closesSource', sourceOpen === false && $('source').style.display === 'none');
      // history view disables source: the source button is disabled and "/" is ignored
      toggleHistory();
      ok('history.srcBtn.disabled', $('srcBtn').disabled === true);
      window.dispatchEvent(new KeyboardEvent('keydown', { key: '/' }));
      ok('history.slash.ignored', sourceOpen === false && historyOpen === true);
      toggleHistory();
      ok('history.srcBtn.reenabled', $('srcBtn').disabled === false);

      // history: objects {code, ts}, date group headers, open/load/delete
      var nowS = Date.now() / 1000;
      setHistory([
        { code: 'graph TD\n  X-->Y', ts: nowS },
        { code: 'sequenceDiagram\n  A->>B: hi', ts: nowS - 2 * 86400 }
      ]);
      toggleHistory();
      ok('history.opens', $('history').style.display === 'block');
      ok('history.lists', $('history').querySelectorAll('.item').length === 2);
      ok('history.groupHeaders', $('history').querySelectorAll('.ghdr').length === 2);
      ok('history.engineLabel', $('history').querySelectorAll('.eng.mmd').length === 2);
      await thumbsDone;   // both items are valid mermaid → each row gets a preview svg
      var thumbSvgs = $('history').querySelectorAll('.thumb svg');
      ok('history.thumbnails', thumbSvgs.length === 2);
      // fit path applied: svg scaled to the box rather than left at natural size
      ok('history.thumbnails.fit', thumbSvgs.length === 2
        && thumbSvgs[0].getAttribute('preserveAspectRatio') === 'xMidYMid meet'
        && thumbSvgs[0].getAttribute('width') === '100%');
      ok('export.disabled.history', $('copyBtn').disabled === true && $('saveBtn').disabled === true);
      // history row image-copy: builds the item's PNG payload and requests a copy, staying in the list
      var hck = null; __onCopy = function (k) { hck = k; };
      await copyHistoryImage(0);
      ok('history.copyImage', hck === 'png' && typeof exportOverride === 'string' && exportOverride.indexOf('<svg') !== -1);
      exportOverride = null; __onCopy = null;
      ok('history.copyImage.staysInHistory', $('history').style.display === 'block');
      deleteHistory(1);
      ok('history.delete', $('history').querySelectorAll('.item').length === 1);
      loadFromHistory(0);
      await new Promise(function (r) { setTimeout(r, 200); });   // let the render settle
      ok('history.load', lastCode.indexOf('graph TD') === 0 && $('history').style.display === 'none');
      ok('export.enabled.afterHistory', $('copyBtn').disabled === false && $('saveBtn').disabled === false);

      // a fresh render closes an open overlay (shows the diagram, not history)
      toggleHistory();
      window.render('graph TD\n  M-->N', 'default', 100, '#fff', 'en');
      await new Promise(function (r) { setTimeout(r, 300); });
      ok('render.closesOverlay', $('history').style.display === 'none' && $('state').style.display !== 'flex');

      // in-flight render gates exports: rendered is false (copy disabled) until it lands
      lastCode = 'graph TD\n  A-->B'; pendingEngine = null;
      var rp = doRender();
      ok('render.inflight.gated', rendered === false && $('copyBtn').disabled === true);
      await rp;
      ok('render.inflight.cleared', rendered === true && $('copyBtn').disabled === false);

      // fit-to-window: enabled on a diagram, re-fits scale, disabled behind an overlay
      ok('fit.enabled.diagram', $('zoomFit').disabled === false);
      scale = 0.111; fitView();
      ok('fit.changesScale', scale !== 0.111 && scale > 0);
      toggleHistory();
      ok('fit.disabled.overlay', $('zoomFit').disabled === true);
      toggleHistory();

      // #meta (engine/time) is shown on the diagram, hidden behind an overlay, restored on return
      ok('meta.shown.diagram', $('meta').classList.contains('show'));
      toggleHistory();
      ok('meta.hidden.overlay', $('meta').classList.contains('show') === false);
      toggleHistory();
      ok('meta.restored.diagram', $('meta').classList.contains('show'));

      // history persists the engine: a PlantUML item whose body has no @start still
      // re-renders as PlantUML (content detection alone would mis-route it to Mermaid)
      thumbCache = {};
      setHistory([{ code: 'class A\nclass B\nA --> B', ts: Date.now() / 1000, engine: 'plantuml' }]);
      toggleHistory();
      ok('history.engine.label.persisted', $('history').querySelector('.eng.puml') !== null);
      loadFromHistory(0);
      await new Promise(function (r) { setTimeout(r, 1500); });
      ok('history.engine.route.persisted', activeEngine === 'plantuml' && $('diagram').querySelectorAll('svg').length === 1);

      // ⌘C echo guard: a synthesized ⌘C right after open must NOT copy the diagram;
      // once the guard window elapses, a deliberate ⌘C does.
      var copies = 0; __onCopy = function () { copies++; };
      window.render('graph TD\n  A-->B', 'default', 100, '#fff', 'en');
      await new Promise(function (r) { setTimeout(r, 300); });   // rendered, still inside the 600ms guard
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'c', metaKey: true }));
      ok('keycopy.suppressedAfterOpen', copies === 0);
      suppressKeyCopyUntil = now() - 1;                          // simulate the guard window elapsing
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'c', metaKey: true }));
      ok('keycopy.allowedLater', copies === 1);
      __onCopy = null;

      // --- font setting ---
      // pure helpers: preamble built from the font; "default" injects nothing
      ok('font.preamble.named', JSON.stringify(pumlPreamble('Helvetica Neue')) === JSON.stringify(['skinparam defaultFontName "Helvetica Neue"']));
      ok('font.preamble.default', JSON.stringify(pumlPreamble('default')) === '[]'
        && JSON.stringify(pumlPreamble('')) === '[]');
      ok('font.injectAfterStart', injectAfterStart('@startuml\nA->B\n@enduml', ['skinparam defaultFontName "X"'])
        === '@startuml\nskinparam defaultFontName "X"\nA->B\n@enduml');
      ok('font.injectAfterStart.noStart', injectAfterStart('class A\nA->B', ['skinparam defaultFontName "X"'])
        === 'class A\nA->B');

      // Mermaid integration: the chosen font reaches the rendered SVG
      window.render('graph TD\n  A-->B', 'default', 100, '#fff', 'en', 'Courier New');
      await new Promise(function (r) { setTimeout(r, 300); });
      ok('font.mermaid.applied', $('diagram').innerHTML.indexOf('Courier New') !== -1);
      ok('font.global.set', currentFont === 'Courier New');

      // "default" leaves Mermaid's own font (no injected family of ours)
      window.render('graph TD\n  A-->B', 'default', 100, '#fff', 'en', 'default');
      await new Promise(function (r) { setTimeout(r, 300); });
      ok('font.mermaid.default', currentFont === 'default'
        && $('diagram').innerHTML.indexOf('"default"') === -1);   // the literal "default" must never pass through as a font

      // PlantUML: source view shows the ORIGINAL — the injected skinparam must not leak
      window.render('@startuml\nclass A\nclass B\nA --> B\n@enduml', 'default', 100, '#fff', 'en', 'Courier New');
      await new Promise(function (r) { setTimeout(r, 1500); });
      toggleSource();
      ok('font.puml.sourceClean', $('srcCode').textContent.indexOf('skinparam defaultFontName') === -1
        && lastCode.indexOf('skinparam') === -1);
      toggleSource();

      } catch (err) {
        R.push({ name: 'EXCEPTION:' + (err && err.message ? err.message : String(err)), pass: false });
      }
      var passed = R.filter(function (x) { return x.pass; }).length;
      var failed = R.filter(function (x) { return !x.pass; }).map(function (x) { return x.name; });
      var summary = JSON.stringify({ pass: passed, total: R.length, failed: failed });
      try { window.webkit.messageHandlers.testResult.postMessage(summary); } catch (e) {}
      return summary;
    };

    // keyboard shortcuts (zoom / copy / save)
    window.addEventListener('keydown', function (e) {
      // Space fits the diagram to the window — diagram view only (in overlays, let Space
      // scroll the source/history content).
      if ((e.key === ' ' || e.key === 'Spacebar') && !e.metaKey) {
        if (!sourceOpen && !historyOpen) { e.preventDefault(); fitView(); }
        return;
      }
      // "/" toggles the source (code) view — diagram view only. Ignored while history
      // is open, where the source button is disabled too (no diagram is selected).
      if (e.key === '/' && !e.metaKey) {
        if (!historyOpen) { e.preventDefault(); toggleSource(); }
        return;
      }
      if (!e.metaKey) return;
      var overlay = sourceOpen || historyOpen;   // zoom only applies to the diagram view
      if ((e.key === '=' || e.key === '+') && !overlay) { setScale(scale * 1.2); e.preventDefault(); }
      else if (e.key === '-' && !overlay) { setScale(scale / 1.2); e.preventDefault(); }
      else if (e.key === '0' && !overlay) { resetView(); e.preventDefault(); }
      else if (e.key === 's') { e.preventDefault(); doSave(); }   // doSave is a no-op while an overlay is open
      else if (e.key === ',') {
        e.preventDefault();
        try { window.webkit.messageHandlers.openSettings.postMessage({}); } catch (e2) {}
      }
      else if (e.key === 'c') {
        // if there is a text selection, let the browser copy that text; only copy PNG when nothing is selected
        var sel = window.getSelection ? String(window.getSelection()) : '';
        if (!sel) { e.preventDefault(); keyboardCopy(); }
      }
    });
    // ⌘/Ctrl + wheel zoom
    var stage = document.getElementById('stage');
    stage.addEventListener('wheel', function (e) {
      if (e.metaKey || e.ctrlKey) {
        e.preventDefault();
        var r = stage.getBoundingClientRect();
        setScale(scale * (e.deltaY < 0 ? 1.1 : 0.9), e.clientX - r.left, e.clientY - r.top);
      }
    }, { passive: false });
    // trackpad pinch
    var gestureBase = 1;
    stage.addEventListener('gesturestart', function (e) { e.preventDefault(); gestureBase = scale; });
    stage.addEventListener('gesturechange', function (e) { e.preventDefault(); setScale(gestureBase * e.scale); });
    // drag pan
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    stage.addEventListener('mousedown', function (e) {
      dragging = true; sx = e.clientX; sy = e.clientY; ox = panX; oy = panY;
      stage.classList.add('panning');
    });
    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      panX = ox + (e.clientX - sx); panY = oy + (e.clientY - sy); applyTransform();
    });
    window.addEventListener('mouseup', function () { dragging = false; stage.classList.remove('panning'); });
  </script>
</body>
</html>
