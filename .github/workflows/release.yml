name: Release

# Manual run: Actions tab → Release → Run workflow
# Auto-increments the version from the latest tag via bump (patch/minor/major).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write   # push commit/tag + create release

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for tag-based version calculation

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          latest="${latest#v}"; [ -z "$latest" ] && latest="0.0.0"
          IFS=. read -r MA MI PA <<< "$latest"
          case "${{ inputs.bump }}" in
            major) MA=$((MA+1)); MI=0; PA=0;;
            minor) MI=$((MI+1)); PA=0;;
            *)     PA=$((PA+1));;
          esac
          VER="$MA.$MI.$PA"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "==> release version: $VER"

      # Version is injected for the build only; it is NOT committed back to the
      # repo. The git tag (created by the release step) is the source of truth,
      # so main stays clean (no per-release commits).
      - name: Inject version into Info.plist (build only)
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" Info.plist

      - name: Build dmg
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh --dmg
          mv -f QuickMermaid.dmg "QuickMermaid-${{ steps.ver.outputs.version }}.dmg"

      # Creates the tag at the current main HEAD and the release with the dmg.
      - name: Create GitHub Release + tag + upload dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            "QuickMermaid-${{ steps.ver.outputs.version }}.dmg" \
            --target "${{ github.sha }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes
